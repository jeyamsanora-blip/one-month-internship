<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard (Demo)</title><link rel="stylesheet" href="style.css"></head><body><main class="container wide"><h2>Admin Dashboard — Demo</h2><p class="warning">This sample page is not protected by admin authentication. Do not deploy it as-is.</p><h3>Add Candidate</h3><input id="name" placeholder="Candidate name"><input id="party" placeholder="Political party"><input id="symbol" placeholder="Candidate symbol"><button onclick="addCandidate()">Add Candidate</button><p id="message" role="status"></p><h3>Candidate List</h3><div id="candidateList"></div><h3>Results</h3><button onclick="loadResults()">Refresh Results</button><div id="results"></div><p><a href="candidates.html">Voter page</a></p></main><script>
async function addCandidate(){const name=document.getElementById('name').value;const party=document.getElementById('party').value;const symbol=document.getElementById('symbol').value;const r=await fetch('/api/candidates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,party,symbol})});const d=await r.json();document.getElementById('message').textContent=d.message;if(r.ok){['name','party','symbol'].forEach(id=>document.getElementById(id).value='');loadCandidates()}}
async function loadCandidates(){const r=await fetch('/api/candidates');const cs=await r.json();const list=document.getElementById('candidateList');list.replaceChildren();cs.forEach(c=>{const p=document.createElement('p');p.textContent=c.name+' — '+c.party+' — '+c.symbol;list.append(p)})}
async function loadResults(){const r=await fetch('/api/results');const xs=await r.json();const el=document.getElementById('results');el.replaceChildren();if(!xs.length){el.textContent='No votes recorded yet.';return}xs.forEach(x=>{const p=document.createElement('p');p.textContent=x.candidateName+': '+x.votes+' vote(s)';el.append(p)})}loadCandidates();
</script></body></html>
