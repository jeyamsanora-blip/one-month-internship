<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Election Candidates</title><link rel="stylesheet" href="style.css"></head><body><main class="container wide"><h2>Available Candidates</h2><p id="welcome"></p><div id="candidateList"></div><p id="message" role="status"></p><h3>Election Results</h3><button onclick="loadResults()">View Results</button><div id="results"></div><button class="secondary" onclick="logout()">Logout</button></main><script>
const user=JSON.parse(localStorage.getItem('user')||'null');if(!user)location.href='login.html';else document.getElementById('welcome').textContent='Welcome, '+user.name;
async function loadCandidates(){try{const r=await fetch('/api/candidates');const cs=await r.json();const list=document.getElementById('candidateList');list.replaceChildren();if(!cs.length){list.textContent='No candidates have been added yet.';return}cs.forEach(c=>{const card=document.createElement('section');card.className='candidate';const h=document.createElement('h3');h.textContent=c.name;const p=document.createElement('p');p.textContent='Party: '+c.party+' | Symbol: '+c.symbol;const b=document.createElement('button');b.textContent=user.hasVoted?'Already voted':'Vote';b.disabled=user.hasVoted;b.onclick=()=>vote(c._id);card.append(h,p,b);list.append(card)})}catch{document.getElementById('message').textContent='Could not load candidates.'}}
async function vote(candidateId){if(user.hasVoted)return;const response=await fetch('/api/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voterId:user.id,candidateId})});const data=await response.json();document.getElementById('message').textContent=data.message;if(response.ok){user.hasVoted=true;localStorage.setItem('user',JSON.stringify(user));loadCandidates()}}
async function loadResults(){const r=await fetch('/api/results');const results=await r.json();const el=document.getElementById('results');el.replaceChildren();if(!results.length){el.textContent='No votes recorded yet.';return}results.forEach(x=>{const p=document.createElement('p');p.textContent=x.candidateName+': '+x.votes+' vote(s)';el.append(p)})}
function logout(){localStorage.removeItem('user');location.href='login.html'}loadCandidates();
</script></body></html>
