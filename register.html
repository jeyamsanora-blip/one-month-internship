<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voter Registration</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><h2>Voter Registration</h2><input id="name" placeholder="Full name" autocomplete="name"><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password (minimum 6 characters)" autocomplete="new-password"><button onclick="register()">Register</button><p id="message" role="status"></p><p>Already registered? <a href="login.html">Login</a></p></main><script>
async function register(){const name=document.getElementById('name').value;const email=document.getElementById('email').value;const password=document.getElementById('password').value;try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password})});const d=await r.json();document.getElementById('message').textContent=d.message;if(r.ok)setTimeout(()=>location.href='login.html',800)}catch{document.getElementById('message').textContent='Could not connect to server.'}}
</script></body></html>
