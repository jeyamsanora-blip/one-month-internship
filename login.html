<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voter Login</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><h2>Voter Login</h2><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">Login</button><p id="message" role="status"></p><p>New voter? <a href="register.html">Register</a></p><p><a href="admin.html">Admin demo page</a></p></main><script>
async function login(){const email=document.getElementById('email').value;const password=document.getElementById('password').value;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok){document.getElementById('message').textContent=d.message;return}localStorage.setItem('user',JSON.stringify(d.user));location.href=d.user.role==='admin'?'admin.html':'candidates.html'}catch{document.getElementById('message').textContent='Could not connect to server.'}}
</script></body></html>
